[project]
name = "tc-power-interface"
version = "0.1.0"
description = "T&C Power Conversion AG-series RF generator control, telemetry, and (future) FLIR closed-loop backend"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
# tcp- = T&C Power. Mirrors FLIR's fri- entry points.
tcp-serve = "tc_power_interface.api.server:main"
tcp-probe = "tc_power_interface.probe:main"
tcp-monitor = "tc_power_interface.monitor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tc_power_interface"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "hardware: requires a physical T&C generator on a serial port (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
