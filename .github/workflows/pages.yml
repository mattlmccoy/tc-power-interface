# GitHub Pages site: the same UI built in site mode, talking to a LOCAL operator (tcp-serve).
# Note: Pages on a private repository needs GitHub Pro/Team/Enterprise; on Free the repo must be
# public (it contains no secrets or vendor binaries). The operator stays on the user's machine.
name: pages
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "23" }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SITE_MODE: "1"
          VITE_BASE: "/tc-power-interface/"
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
